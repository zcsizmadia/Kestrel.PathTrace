name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix: &platform-matrix
        include:
          - runtimeId: win-x64
            os: windows-latest

          - runtimeId: win-arm64
            os: windows-11-arm

          - runtimeId: linux-x64
            os: ubuntu-latest

          - runtimeId: linux-arm64
            os: ubuntu-24.04-arm

          - runtimeId: linux-musl-x64
            os: ubuntu-latest
            container: alpine:latest

          - runtimeId: linux-musl-arm64
            os: ubuntu-24.04-arm
            container: alpine:latest

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    name: Build - (${{ matrix.runtimeId }})

    steps:
      # action/checkout fails on Alpine Arm64 without this fix
      - name: Fix Alpine arm64 compatibility
        if: matrix.runtimeId == 'linux-musl-arm64'
        uses: laverdet/alpine-arm64@v1

      - uses: actions/checkout@v6

      # Install packages needed for building the native libraries.
      - name: Install packages
        shell: sh
        run: |
          if [ -f /etc/alpine-release ]; then
            apk add --no-cache \
              build-base cmake clang git curl tar bash icu pkgconf linux-headers
          fi

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build native library
        shell: bash
        run: native/scripts/build-and-install.sh

      - name: Build
        shell: bash
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Test
        shell: bash
        run: |
          dotnet test -c Release --no-build --no-restore

      - name: Upload native library artifact
        uses: actions/upload-artifact@v7
        with:
          name: runtimes-${{ matrix.runtimeId }}
          path: runtimes

  build-nupkg:
    needs: [build]
    runs-on: ubuntu-latest
    name: Build NuGet package
    if: always() && needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v6

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Download all native library artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: runtimes-*
          path: runtimes
          merge-multiple: true

      - name: Pack NuGet package
        shell: bash
        run: |
          dotnet restore
          dotnet build -c Release --no-restore
          dotnet pack -c Release -o nupkgs --no-build src/Kestrel.PathTrace/
          dotnet pack -c Release -o nupkgs --no-build src/Kestrel.PathTrace.OpenTelemetry/
          dotnet pack -c Release -o nupkgs --no-build src/Kestrel.PathTrace.Prometheus/

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            nupkgs/*.nupkg

  validate-nupkg:
    needs: [build-nupkg]
    if: always() && needs['build-nupkg'].result == 'success'
    strategy:
      fail-fast: false
      matrix: *platform-matrix
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    name: Validate NuGet - (${{ matrix.runtimeId }})

    steps:
      # Must come before checkout on Alpine arm64.
      - name: Fix Alpine arm64 compatibility
        if: matrix.runtimeId == 'linux-musl-arm64'
        uses: laverdet/alpine-arm64@v1

      - uses: actions/checkout@v6

      # Provides bash, curl, and ICU (required by the .NET runtime) on Alpine.
      - name: Install Alpine dependencies
        if: contains(matrix.runtimeId, 'musl')
        shell: sh
        run: |
          apk add --no-cache bash curl tar icu-libs

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: nupkgs

      # Write a project-scoped nuget.config so that only the local artifact feed
      # (plus nuget.org for transitive deps) is used during validation.
      # <clear /> prevents any machine/user-level source from leaking in.
      - name: Write local nuget.config for BasicSample
        shell: bash
        run: |
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<configuration>' \
            '  <packageSources>' \
            '    <clear />' \
            '    <add key="local" value="../../nupkgs" />' \
            '    <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />' \
            '  </packageSources>' \
            '</configuration>' \
            > samples/BasicSample/nuget.config

      # Directory.Packages.props exposes the three Kestrel.PathTrace PackageVersion
      # entries only when ValidateNupkg=true, so CPM resolves them from the local feed.
      - name: Restore and build BasicSample against packed NuGet packages
        shell: bash
        run: |
          dotnet restore -p:ValidateNupkg=true samples/BasicSample/
          dotnet build -c Release --no-restore -p:ValidateNupkg=true samples/BasicSample/

      # Run the sample for 10 s and let it shut itself down cleanly (exit 0).
      # A non-zero exit code means the app crashed on startup.
      - name: Run BasicSample for 10 s (smoke test)
        shell: bash
        run: |
          dotnet run -c Release --no-build --project samples/BasicSample/ \
            -p:ValidateNupkg=true -- --run-for-seconds 10
